# Builds one open-source app every two hours on each track, with hct as a
# newcomer would: xcode (tests/real-apps/xcode.txt, on macOS) and android
# (android.txt, on Linux). Each run takes an app whose issue is labelled
# real-app-retry, else the next on the track's list in turn. Files an issue
# (labels real-app, real-app:<track>) when something goes wrong or nothing
# was built, or comments on the app's open one. No AI:
# tests/real-apps/try-next.sh and report.py.
#
# GitHub drops scheduled runs when it's busy (a two-hourly cron ran about
# every five hours), so each track is scheduled every half hour and its pick
# job stops the run when the track built in the last 110 minutes; a retry
# goes ahead at once.
name: real apps
run-name: "real apps (${{ inputs.track || (github.event.schedule == '28,58 * * * *' && 'android') || 'xcode' }})"

on:
  schedule:
    - cron: "13,43 * * * *" # xcode
    - cron: "28,58 * * * *" # android
  workflow_dispatch:
    inputs:
      track:
        description: "Track"
        type: choice
        options:
          - xcode
          - android
        default: xcode
      app:
        description: "owner/repo to build (default: a retry, else whose turn it is)"
        required: false

concurrency:
  group: real-apps-${{ inputs.track || github.event.schedule }}
  cancel-in-progress: false

env:
  TRACK: ${{ inputs.track || (github.event.schedule == '28,58 * * * *' && 'android') || 'xcode' }}

jobs:
  # Which app: the manual input, a retry, or whose turn it is; and the
  # runner its track builds on.
  pick:
    if: github.repository == 'dnf/hecatron'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      issues: read
    outputs:
      skip: ${{ steps.pick.outputs.skip }}
      track: ${{ steps.pick.outputs.track }}
      runner: ${{ steps.pick.outputs.runner }}
      app: ${{ steps.pick.outputs.app }}
      retry_issue: ${{ steps.pick.outputs.retry_issue }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: pick
        env:
          APP: ${{ inputs.app }}
          GH_TOKEN: ${{ github.token }}
          GATE: ${{ github.event_name == 'schedule' && '110' || '' }}
        run: bash tests/real-apps/try-next.sh pick

  # Runs the app's own build scripts, so it gets no token that can write.
  build:
    needs: pick
    if: needs.pick.outputs.skip != 'true'
    runs-on: ${{ needs.pick.outputs.runner }}
    timeout-minutes: 120
    permissions:
      contents: read
    env:
      TRACK: ${{ needs.pick.outputs.track }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # Gradle builds of large apps fill the runner's disk; these aren't used.
      - name: Free disk space
        if: env.TRACK == 'android'
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost
      # A submodule or package given by its SSH URL (Delta's DeltaCore,
      # Simplenote's Swift packages) needs a key the runner hasn't: a
      # newcomer without one fetches it over HTTPS. Global, so xcodebuild's
      # and Gradle's git fetches get it too.
      - name: Fetch GitHub over HTTPS
        run: |
          git config --global url.https://github.com/.insteadOf git@github.com:
          git config --global --add url.https://github.com/.insteadOf ssh://git@github.com/
      - name: Build the next app
        env:
          APP: ${{ needs.pick.outputs.app }}
          RETRY_ISSUE: ${{ needs.pick.outputs.retry_issue }}
        run: bash tests/real-apps/try-next.sh build "${RUNNER_TEMP}/real-app"
      # The app and whether it was a retry, small, for the next run's pick
      # (the rotation follows the last build, not the clock).
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: real-app-meta
          path: ${{ runner.temp }}/real-app/meta.tsv
          retention-days: 30
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: real-app-logs
          path: |
            ${{ runner.temp }}/real-app/meta.tsv
            ${{ runner.temp }}/real-app/steps.tsv
            ${{ runner.temp }}/real-app/plan.json
            ${{ runner.temp }}/real-app/build.json
            ${{ runner.temp }}/real-app/logs
          retention-days: 14
          if-no-files-found: ignore

  # Files or updates the issue from what the build recorded; runs none of
  # the app's code.
  report:
    needs: [pick, build]
    if: always() && needs.pick.result == 'success' && needs.pick.outputs.skip != 'true' && needs.build.result != 'cancelled'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    env:
      TRACK: ${{ needs.pick.outputs.track }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: real-app-logs
          path: ${{ runner.temp }}/real-app
      - name: File or update the issue
        env:
          GH_TOKEN: ${{ github.token }}
          RETRY_ISSUE: ${{ needs.pick.outputs.retry_issue }}
        run: bash tests/real-apps/try-next.sh report "${RUNNER_TEMP}/real-app"
