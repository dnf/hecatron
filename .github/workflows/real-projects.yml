name: Real projects

# Try hecatron on real open-source projects (tests/real-projects/): each job
# clones one project in a fresh Ubuntu container and runs hct init, install,
# doctor and test for each language, as a newcomer would. Monthly, and on
# demand for some projects. A full run on main opens, or updates, a pull
# request with the results (docs/real-projects.md and the data files).
#
# Jobs share each language's toolchain install through actions/cache
# (tests/real-projects/cache.py): a job testing one language saves its
# install, and later jobs with that language restore it. Every third
# scheduled run, and a dispatch asking for it, uses no cache, to show the
# installs still work from scratch.

on:
  # Retesting fixes before this workflow is on main: a push to a
  # real-projects-retest/* branch tests the projects listed in
  # tests/real-projects/retest.txt (every project when it's absent).
  push:
    branches: ["real-projects-retest/**"]
  schedule:
    - cron: "0 4 3 * *"
  workflow_dispatch:
    inputs:
      repos:
        description: "Projects to test, space-separated OWNER/REPO (empty: every project in tests/real-projects/projects.json)"
        required: false
        default: ""
      actions:
        description: "Actions per language, comma-separated, of test, lint and build (the monthly run: test)"
        required: false
        default: "test"
      cache:
        description: "Restore and save the toolchain caches (off: install everything from scratch)"
        type: boolean
        default: true
      parallel:
        description: "Most projects tested at once"
        type: string
        default: "12"

permissions:
  contents: read

# A new push to a retest branch cancels that branch's run still going;
# scheduled and dispatched runs keep their own.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  projects:
    runs-on: ubuntu-latest
    outputs:
      list: ${{ steps.list.outputs.list }}
      cache: ${{ steps.cache.outputs.cache }}
    steps:
      - uses: actions/checkout@v4
      - id: cache
        env:
          WANTED: ${{ inputs.cache }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          cache=true
          if [ "${WANTED}" = false ]; then
            cache=false
          elif [ "${GITHUB_EVENT_NAME}" = schedule ] && [ $((RUN_NUMBER % 3)) -eq 0 ]; then
            cache=false
          fi
          echo "cache=${cache}" >> "${GITHUB_OUTPUT}"
      - id: list
        env:
          REQUESTED: ${{ inputs.repos }}
        run: |
          if [ -z "${REQUESTED}" ] && [ "${GITHUB_EVENT_NAME}" = push ] && [ -f tests/real-projects/retest.txt ]; then
            REQUESTED="$(grep -v '^#' tests/real-projects/retest.txt | tr '\n' ' ')"
          fi
          if [ -n "${REQUESTED}" ]; then
            list="$(printf '%s\n' ${REQUESTED} | python3 -c 'import json, sys; print(json.dumps(sys.stdin.read().split()))')"
          else
            list="$(python3 tests/real-projects/cache.py order)"
          fi
          echo "list=${list}" >> "${GITHUB_OUTPUT}"

  # hecatron's Go binary, built once from this checkout for every job: the
  # run commands' --output json and hct status need it.
  binary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Build
        env:
          CGO_ENABLED: "0"
        run: bin/hecatron self-build
      - uses: actions/upload-artifact@v4
        with:
          name: hecatron-binary
          path: bin/.hecatron-go
          include-hidden-files: true
          if-no-files-found: error

  project:
    needs: [projects, binary]
    strategy:
      fail-fast: false
      # An account runs 20 jobs at once: a dispatched run leaves room for CI
      # on other pull requests; the monthly one, at night, takes them all.
      max-parallel: ${{ github.event_name == 'schedule' && 20 || fromJSON(inputs.parallel || '12') }}
      matrix:
        repo: ${{ fromJSON(needs.projects.outputs.list) }}
    runs-on: ubuntu-24.04
    # run.sh stops starting steps after 55 minutes.
    timeout-minutes: 65
    steps:
      - id: name
        env:
          REPO: ${{ matrix.repo }}
        run: echo "name=${REPO//\//_}" >> "${GITHUB_OUTPUT}"
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: hecatron-binary
          path: bin
      - name: Use the binary on this checkout
        run: |
          chmod +x bin/.hecatron-go
          echo dev > bin/.hecatron-go.commit
      # Big projects install many toolchains in the container; the runner's
      # own preinstalled SDKs aren't used, so make room.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/share/swift
          df -h /
      # The caches of the languages the project is likely to have (at most
      # eight; tests/real-projects/cache.py).
      - id: plan
        if: needs.projects.outputs.cache == 'true'
        env:
          REPO: ${{ matrix.repo }}
        run: python3 tests/real-projects/cache.py plan "${REPO}" | tee -a "${GITHUB_OUTPUT}"
      - name: Restore ${{ steps.plan.outputs.lang1 }}'s toolchain
        if: steps.plan.outputs.key1 != ''
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/real-projects-cache/${{ steps.plan.outputs.lang1 }}
          key: ${{ steps.plan.outputs.key1 }}
      - name: Restore ${{ steps.plan.outputs.lang2 }}'s toolchain
        if: steps.plan.outputs.key2 != ''
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/real-projects-cache/${{ steps.plan.outputs.lang2 }}
          key: ${{ steps.plan.outputs.key2 }}
      - name: Restore ${{ steps.plan.outputs.lang3 }}'s toolchain
        if: steps.plan.outputs.key3 != ''
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/real-projects-cache/${{ steps.plan.outputs.lang3 }}
          key: ${{ steps.plan.outputs.key3 }}
      - name: Restore ${{ steps.plan.outputs.lang4 }}'s toolchain
        if: steps.plan.outputs.key4 != ''
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/real-projects-cache/${{ steps.plan.outputs.lang4 }}
          key: ${{ steps.plan.outputs.key4 }}
      - name: Restore ${{ steps.plan.outputs.lang5 }}'s toolchain
        if: steps.plan.outputs.key5 != ''
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/real-projects-cache/${{ steps.plan.outputs.lang5 }}
          key: ${{ steps.plan.outputs.key5 }}
      - name: Restore ${{ steps.plan.outputs.lang6 }}'s toolchain
        if: steps.plan.outputs.key6 != ''
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/real-projects-cache/${{ steps.plan.outputs.lang6 }}
          key: ${{ steps.plan.outputs.key6 }}
      - name: Restore ${{ steps.plan.outputs.lang7 }}'s toolchain
        if: steps.plan.outputs.key7 != ''
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/real-projects-cache/${{ steps.plan.outputs.lang7 }}
          key: ${{ steps.plan.outputs.key7 }}
      - name: Restore ${{ steps.plan.outputs.lang8 }}'s toolchain
        if: steps.plan.outputs.key8 != ''
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/real-projects-cache/${{ steps.plan.outputs.lang8 }}
          key: ${{ steps.plan.outputs.key8 }}
      - name: Test ${{ matrix.repo }}
        env:
          REPO: ${{ matrix.repo }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          CACHE: ${{ needs.projects.outputs.cache }}
          ACTIONS: ${{ inputs.actions || 'test' }}
        run: |
          if [ "${CACHE}" = true ]; then
            # Made here, not by docker, so the container's user owns it.
            export HECATRON_TEST_CACHE="${RUNNER_TEMP}/real-projects-cache"
            mkdir -p "${HECATRON_TEST_CACHE}"
          fi
          tests/docker/run.sh ubuntu:24.04 python3 /hecatron/tests/real-projects/cache.py run --image ubuntu:24.04 --budget 3300 --actions "${ACTIONS}" \
            --host "GitHub Actions ubuntu-24.04 (${ImageVersion:-unknown image version})" --run-url "${RUN_URL}" \
            "${REPO}" 2>&1 | tee run.log || true
          python3 tests/real-projects/report.py summary run.log >> "${GITHUB_STEP_SUMMARY}" || true
      - id: saved
        if: needs.projects.outputs.cache == 'true'
        run: cat "${RUNNER_TEMP}/real-projects-cache/saved" >> "${GITHUB_OUTPUT}" 2>/dev/null || true
      - name: Save ${{ steps.saved.outputs.lang }}'s toolchain
        if: steps.saved.outputs.key != ''
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/real-projects-cache/${{ steps.saved.outputs.lang }}
          key: ${{ steps.saved.outputs.key }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: real-project-${{ steps.name.outputs.name }}
          path: run.log

  results:
    needs: project
    if: always() && needs.project.result != 'skipped'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      BRANCH: update/real-projects
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: real-project-*
          path: logs
      - name: Refresh the projects' GitHub metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tests/real-projects/verify.py --write || true
      - name: Collect and render
        run: |
          python3 tests/real-projects/report.py collect logs/*/run.log
          python3 tests/real-projects/report.py render
          cat docs/real-projects.md >> "${GITHUB_STEP_SUMMARY}"
      - uses: actions/upload-artifact@v4
        with:
          name: real-projects-results
          path: |
            docs/real-projects.md
            tests/real-projects/projects.json
            tests/real-projects/results.json
            tests/real-projects/results-by-language.json
            tests/real-projects/badges
      # A full run on main (every project, as the monthly one is) proposes its
      # results; a run for some projects, or on a branch, only uploads them.
      - name: Open or update the pull request with the results
        if: github.ref == 'refs/heads/main' && (inputs.repos == '' || github.event_name == 'schedule')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          files="docs/real-projects.md tests/real-projects/projects.json tests/real-projects/results.json tests/real-projects/results-by-language.json tests/real-projects/badges"
          # status, not diff: a newly tested project's badge is a new file.
          if [ -z "$(git status --porcelain -- ${files})" ]; then
            echo "Results unchanged." >> "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "${BRANCH}"
          git add -A -- ${files}
          git commit -q -m "Update the real-project results" -m "From the real-projects run ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID} at ${GITHUB_SHA}."
          git push -q -f origin "${BRANCH}"
          body="$(printf 'Real-project results from [this run](%s/%s/actions/runs/%s) at %s.\n\nOpened by the Real projects workflow, which updates this pull request each run; close and reopen it to run CI.\n' "${GITHUB_SERVER_URL}" "${GITHUB_REPOSITORY}" "${GITHUB_RUN_ID}" "${GITHUB_SHA}")"
          if [ "$(gh pr view "${BRANCH}" --json state --jq .state 2>/dev/null)" = "OPEN" ]; then
            gh pr edit "${BRANCH}" --body "${body}"
          elif ! gh pr create --base main --head "${BRANCH}" --title "Update the real-project results" --body "${body}"; then
            echo "::error::Couldn't open the pull request. Allow GitHub Actions to create pull requests (Settings > Actions > General), or open it by hand: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/compare/main...${BRANCH}"
            exit 1
          fi
