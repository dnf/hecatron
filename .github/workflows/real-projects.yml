name: Real projects

# Try hecatron on real open-source projects (tests/real-projects/): each job
# clones one project in a fresh Ubuntu container and runs hct init, install,
# doctor and test for each language, as a newcomer would. Monthly, and on
# demand for some projects. A full run on main opens, or updates, a pull
# request with the results (docs/real-projects.md and the data files).

on:
  # Retesting fixes before this workflow is on main: a push to a
  # real-projects-retest/* branch tests the projects listed in
  # tests/real-projects/retest.txt (every project when it's absent).
  push:
    branches: ["real-projects-retest/**"]
  schedule:
    - cron: "0 4 3 * *"
  workflow_dispatch:
    inputs:
      repos:
        description: "Projects to test, space-separated OWNER/REPO (empty: every project in tests/real-projects/projects.json)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  projects:
    runs-on: ubuntu-latest
    outputs:
      list: ${{ steps.list.outputs.list }}
    steps:
      - uses: actions/checkout@v4
      - id: list
        env:
          REQUESTED: ${{ inputs.repos }}
        run: |
          if [ -z "${REQUESTED}" ] && [ "${GITHUB_EVENT_NAME}" = push ] && [ -f tests/real-projects/retest.txt ]; then
            REQUESTED="$(grep -v '^#' tests/real-projects/retest.txt | tr '\n' ' ')"
          fi
          if [ -n "${REQUESTED}" ]; then
            list="$(printf '%s\n' ${REQUESTED} | python3 -c 'import json, sys; print(json.dumps(sys.stdin.read().split()))')"
          else
            list="$(python3 -c 'import json; print(json.dumps([p["repo"] for p in json.load(open("tests/real-projects/projects.json"))["projects"]]))')"
          fi
          echo "list=${list}" >> "${GITHUB_OUTPUT}"

  # hecatron's Go binary, built once from this checkout for every job: the
  # run commands' --output json and hct status need it.
  binary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Build
        env:
          CGO_ENABLED: "0"
        run: bin/hecatron self-build
      - uses: actions/upload-artifact@v4
        with:
          name: hecatron-binary
          path: bin/.hecatron-go
          include-hidden-files: true
          if-no-files-found: error

  project:
    needs: [projects, binary]
    strategy:
      fail-fast: false
      # Leaves room for CI on other pull requests: an account runs 20 jobs at once.
      max-parallel: 12
      matrix:
        repo: ${{ fromJSON(needs.projects.outputs.list) }}
    runs-on: ubuntu-24.04
    # run.sh stops starting steps after 55 minutes.
    timeout-minutes: 65
    steps:
      - id: name
        env:
          REPO: ${{ matrix.repo }}
        run: echo "name=${REPO//\//_}" >> "${GITHUB_OUTPUT}"
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: hecatron-binary
          path: bin
      - name: Use the binary on this checkout
        run: |
          chmod +x bin/.hecatron-go
          echo dev > bin/.hecatron-go.commit
      # Big projects install many toolchains in the container; the runner's
      # own preinstalled SDKs aren't used, so make room.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/share/swift
          df -h /
      - name: Test ${{ matrix.repo }}
        env:
          REPO: ${{ matrix.repo }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          tests/real-projects/run.sh --docker ubuntu:24.04 --budget 3300 \
            --host "GitHub Actions ubuntu-24.04 (${ImageVersion:-unknown image version})" --run-url "${RUN_URL}" \
            "${REPO}" 2>&1 | tee run.log || true
          python3 tests/real-projects/report.py summary run.log >> "${GITHUB_STEP_SUMMARY}" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: real-project-${{ steps.name.outputs.name }}
          path: run.log

  results:
    needs: project
    if: always() && needs.project.result != 'skipped'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      BRANCH: update/real-projects
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: real-project-*
          path: logs
      - name: Refresh the projects' GitHub metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tests/real-projects/verify.py --write || true
      - name: Collect and render
        run: |
          python3 tests/real-projects/report.py collect logs/*/run.log
          python3 tests/real-projects/report.py render
          cat docs/real-projects.md >> "${GITHUB_STEP_SUMMARY}"
      - uses: actions/upload-artifact@v4
        with:
          name: real-projects-results
          path: |
            docs/real-projects.md
            tests/real-projects/projects.json
            tests/real-projects/results.json
            tests/real-projects/results-by-language.json
      # A full run on main (every project, as the monthly one is) proposes its
      # results; a run for some projects, or on a branch, only uploads them.
      - name: Open or update the pull request with the results
        if: github.ref == 'refs/heads/main' && (inputs.repos == '' || github.event_name == 'schedule')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          files="docs/real-projects.md tests/real-projects/projects.json tests/real-projects/results.json tests/real-projects/results-by-language.json"
          if git diff --quiet -- ${files}; then
            echo "Results unchanged." >> "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "${BRANCH}"
          git add ${files}
          git commit -q -m "Update the real-project results" -m "From the real-projects run ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID} at ${GITHUB_SHA}."
          git push -q -f origin "${BRANCH}"
          body="$(printf 'Real-project results from [this run](%s/%s/actions/runs/%s) at %s.\n\nOpened by the Real projects workflow, which updates this pull request each run; close and reopen it to run CI.\n' "${GITHUB_SERVER_URL}" "${GITHUB_REPOSITORY}" "${GITHUB_RUN_ID}" "${GITHUB_SHA}")"
          if [ "$(gh pr view "${BRANCH}" --json state --jq .state 2>/dev/null)" = "OPEN" ]; then
            gh pr edit "${BRANCH}" --body "${body}"
          elif ! gh pr create --base main --head "${BRANCH}" --title "Update the real-project results" --body "${body}"; then
            echo "::error::Couldn't open the pull request. Allow GitHub Actions to create pull requests (Settings > Actions > General), or open it by hand: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/compare/main...${BRANCH}"
            exit 1
          fi
