name: Weekly updates

# Weekly, and on demand:
# - Regenerate the release-date tables (languages/<lang>/releases.json) that
#   version resolution reads for old checkouts (docs/guide/versions.md), and open
#   or update a pull request when a language has new releases. A pull request
#   opened with the workflow's token doesn't start CI, so the self test runs
#   here first; close and reopen the pull request to run CI on it.
# - Check every external link in the docs, and keep one issue open listing
#   those that don't work, closed again once they all do.

on:
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-dates

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      BRANCH: update/release-dates
    steps:
      - uses: actions/checkout@v4
      - name: Regenerate the tables
        run: python3 libexec/maintenance/release_dates.py
      - name: What changed
        id: changes
        run: |
          {
            for f in $(git diff --name-only -- 'languages/*/releases.json'); do
              added=$(git diff -U0 -- "${f}" | grep -c '^+    \[' || true)
              removed=$(git diff -U0 -- "${f}" | grep -c '^-    \[' || true)
              newest=$(python3 -c 'import json, sys; print(json.load(open(sys.argv[1]))["releases"][-1][0])' "${f}")
              echo "- $(basename "$(dirname "${f}")"): $((added - removed)) new, newest ${newest}"
            done
          } > "${RUNNER_TEMP}/changes.md"
          cat "${RUNNER_TEMP}/changes.md"
          if [ -s "${RUNNER_TEMP}/changes.md" ]; then
            echo "changed=true" >> "${GITHUB_OUTPUT}"
          else
            echo "No new releases." >> "${GITHUB_STEP_SUMMARY}"
          fi
      - name: The self test passes with the new tables
        if: steps.changes.outputs.changed == 'true'
        run: bin/hecatron self test
      - name: Open or update the pull request
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          body="$(printf 'New releases since the tables were last written:\n\n%s\n\nGenerated by `libexec/maintenance/release_dates.py` (the Release dates workflow). The self test passed in that run; close and reopen this pull request to run CI.\n' "$(cat "${RUNNER_TEMP}/changes.md")")"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "${BRANCH}"
          git commit -q -a -m "Update the release-date tables" -m "$(cat "${RUNNER_TEMP}/changes.md")"
          git push -q -f origin "${BRANCH}"
          if [ "$(gh pr view "${BRANCH}" --json state --jq .state 2>/dev/null)" = "OPEN" ]; then
            gh pr edit "${BRANCH}" --body "${body}"
            echo "Updated $(gh pr view "${BRANCH}" --json url --jq .url)" >> "${GITHUB_STEP_SUMMARY}"
          elif gh pr create --base main --head "${BRANCH}" --title "Update the release-date tables" --body "${body}"; then
            echo "Opened $(gh pr view "${BRANCH}" --json url --jq .url)" >> "${GITHUB_STEP_SUMMARY}"
          else
            echo "::error::Couldn't open the pull request. Allow GitHub Actions to create pull requests (Settings > Actions > General), or open it by hand: https://github.com/${GITHUB_REPOSITORY}/compare/main...${BRANCH}"
            exit 1
          fi

  links:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    env:
      TITLE: Broken links in the docs
    steps:
      - uses: actions/checkout@v4
      - name: Check the links
        id: check
        run: |
          if python3 libexec/maintenance/check_links.py --markdown > "${RUNNER_TEMP}/links.md"; then
            echo "broken=false" >> "${GITHUB_OUTPUT}"
          else
            echo "broken=true" >> "${GITHUB_OUTPUT}"
          fi
          cat "${RUNNER_TEMP}/links.md" >> "${GITHUB_STEP_SUMMARY}"
      - name: Open, update or close the issue
        env:
          GH_TOKEN: ${{ github.token }}
          BROKEN: ${{ steps.check.outputs.broken }}
        run: |
          issue="$(gh issue list --state open --search "in:title \"${TITLE}\"" --json number,title \
            --jq "map(select(.title == env.TITLE)) | .[0].number // empty")"
          if [ "${BROKEN}" = "true" ]; then
            printf '\n\nChecked %s by the Weekly updates workflow; it updates this issue each week and closes it once every link works.\n' "$(date -u +%Y-%m-%d)" >> "${RUNNER_TEMP}/links.md"
            if [ -n "${issue}" ]; then
              gh issue edit "${issue}" --body-file "${RUNNER_TEMP}/links.md"
            else
              gh issue create --title "${TITLE}" --label documentation --body-file "${RUNNER_TEMP}/links.md"
            fi
          elif [ -n "${issue}" ]; then
            gh issue close "${issue}" --comment "Every link works again as of $(date -u +%Y-%m-%d)."
          fi
