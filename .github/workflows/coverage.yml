name: Coverage

# Check every language's toolchain on every platform (tests/install/check.sh)
# and build the coverage matrix (docs/coverage.md) from the results. Weekly,
# and on demand for some languages. A full run opens, or updates, a pull
# request with the new matrix.

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      languages:
        description: "Languages to check, space-separated (empty: all)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  languages:
    runs-on: ubuntu-latest
    outputs:
      list: ${{ steps.list.outputs.list }}
    steps:
      - uses: actions/checkout@v4
      - id: list
        env:
          REQUESTED: ${{ inputs.languages }}
        run: |
          if [ -n "${REQUESTED}" ]; then
            languages="${REQUESTED}"
          else
            languages="$(find languages -mindepth 1 -maxdepth 1 -type d ! -name '_*' -exec basename {} \; | sort)"
          fi
          echo "list=$(printf '%s\n' ${languages} | python3 -c 'import json, sys; print(json.dumps(sys.stdin.read().split()))')" >> "${GITHUB_OUTPUT}"

  # Each Linux job checks one language on one architecture, in fresh
  # Ubuntu 24.04, Ubuntu 26.04 and Debian 13 containers (tests/docker/).
  linux:
    needs: languages
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        language: ${{ fromJSON(needs.languages.outputs.list) }}
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Check on Ubuntu 24.04, Ubuntu 26.04 and Debian 13
        run: |
          for image in ubuntu:24.04 ubuntu:26.04 debian:stable; do
            tests/docker/install-test.sh "${image}" "${{ matrix.language }}" 2>&1 | tee -a check.log || true
          done
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.language }}-${{ matrix.runner }}
          path: check.log

  # macOS jobs check directly on the runner, which comes with many toolchains
  # preinstalled.
  macos:
    needs: languages
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        language: ${{ fromJSON(needs.languages.outputs.list) }}
        runner: [macos-26, macos-26-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install bash 4+ (hecatron's runner needs it; macOS ships 3.2)
        run: brew install bash
      - name: Check
        run: |
          export PATH="${PWD}/bin:${PATH}"
          tests/install/check.sh "${{ matrix.language }}" 2>&1 | tee check.log || true
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.language }}-${{ matrix.runner }}
          path: check.log

  # Each .NET component runs the SDK hecatron resolves for it, the newest
  # where only a workflow names a version (tests/docker/dotnet-sdks.sh). Its
  # own job, on one platform: it downloads two SDKs.
  dotnet-sdks:
    if: inputs.languages == '' || contains(inputs.languages, 'csharp')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Each component runs the SDK its version resolves to
        run: tests/docker/run.sh ubuntu:24.04 bash /hecatron/tests/docker/dotnet-sdks.sh

  matrix:
    needs: [linux, macos]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      BRANCH: update/coverage
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: coverage-*
          path: logs
      - name: Build the matrix
        run: |
          python3 tests/coverage/matrix.py collect --commit "${GITHUB_SHA}" logs/*/check.log
          python3 tests/coverage/matrix.py render
          cat docs/coverage.md >> "${GITHUB_STEP_SUMMARY}"
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-matrix
          path: |
            docs/coverage.md
            tests/coverage/results.json
      # A full run (every language, as the weekly one is) proposes its results;
      # a run for some languages only would leave the page half-updated.
      - name: Open or update the pull request with the results
        if: inputs.languages == '' || github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- docs/coverage.md tests/coverage/results.json; then
            echo "Coverage unchanged." >> "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "${BRANCH}"
          git add docs/coverage.md tests/coverage/results.json
          git commit -q -m "Update the coverage matrix" -m "From the coverage run ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID} at ${GITHUB_SHA}."
          git push -q -f origin "${BRANCH}"
          body="$(printf 'The coverage matrix from [this run](%s/%s/actions/runs/%s) at %s.\n\nOpened by the Coverage workflow, which updates this pull request each run; close and reopen it to run CI.\n' "${GITHUB_SERVER_URL}" "${GITHUB_REPOSITORY}" "${GITHUB_RUN_ID}" "${GITHUB_SHA}")"
          if [ "$(gh pr view "${BRANCH}" --json state --jq .state 2>/dev/null)" = "OPEN" ]; then
            gh pr edit "${BRANCH}" --body "${body}"
          elif ! gh pr create --base main --head "${BRANCH}" --title "Update the coverage matrix" --body "${body}"; then
            echo "::error::Couldn't open the pull request. Allow GitHub Actions to create pull requests (Settings > Actions > General), or open it by hand: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/compare/main...${BRANCH}"
            exit 1
          fi
