name: CI
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Gradle lock tests, looped, with the noclobber lock
        run: |
          mkdir --version | head -1
          fails=0
          for i in $(seq 1 25); do
            python3 -m unittest tests.test_build_hooks.GradleTest.test_one_gradle_run_at_a_time_in_a_build tests.test_build_hooks.GradleTest.test_a_lock_left_by_a_killed_run_is_taken_over >/dev/null 2>&1 || fails=$((fails+1))
          done
          echo "failures: ${fails}/25"
          [ "${fails}" -eq 0 ]
