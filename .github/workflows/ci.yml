name: CI
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Gradle lock test, looped
        run: |
          uname -a; bash --version | head -1; java -version 2>&1 | head -1; echo "CDPATH=${CDPATH:-}"; nproc
          sed -i 's|        until mkdir "${_lock}" 2>/dev/null; do|        echo "LOCKDBG $$ lock=${_lock}" >\&2\n        until mkdir "${_lock}"; do echo "LOCKDBG $$ mkdir failed, holder=$(cat "${_lock}/pid" 2>/dev/null)" >\&2|' languages/_hooks.sh
          sed -i 's|    _gradle_lock="${_lock}"|    echo "LOCKDBG $$ took the lock: $(ls -la "${_lock}")" >\&2\n    _gradle_lock="${_lock}"|' languages/_hooks.sh
          sed -n '/^gradle_lock()/,/^}/p' languages/_hooks.sh
          fails=0
          for i in $(seq 1 25); do
            out="$(python3 -m unittest tests.test_build_hooks.GradleTest.test_one_gradle_run_at_a_time_in_a_build 2>&1)" || { fails=$((fails+1)); echo "=== run ${i} failed"; echo "${out}" | tail -30; }
          done
          echo "failures: ${fails}/25"
          echo "=== whole GradleTest class"; python3 -m unittest tests.test_build_hooks.GradleTest 2>&1 | tail -30
