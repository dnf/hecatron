name: CI

# Every pull request runs the jobs its changes can affect
# (libexec/maintenance/ci-jobs.sh decides which; documentation alone runs
# only the docs job), and ci-ok, the one check to require, passes when every
# job that ran did. A push to main runs everything.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A new push to a pull request cancels its run still going; every commit on
# main keeps its own run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The jobs this change can affect, from the paths it changes against the
  # pull request's base (the merge commit's first parent).
  changes:
    runs-on: ubuntu-latest
    outputs:
      docs: ${{ steps.select.outputs.docs }}
      test_os: ${{ steps.select.outputs.test_os }}
      self_hosted: ${{ steps.select.outputs.self_hosted }}
      go: ${{ steps.select.outputs.go }}
      bash_3_2: ${{ steps.select.outputs.bash_3_2 }}
      installer_linux: ${{ steps.select.outputs.installer_linux }}
      installer_macos: ${{ steps.select.outputs.installer_macos }}
      install_parity: ${{ steps.select.outputs.install_parity }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Select the jobs
        id: select
        env:
          EVENT: ${{ github.event_name }}
        # Anything but a pull request, or a diff that fails, runs everything.
        run: |
          if [ "${EVENT}" = pull_request ] && changed="$(git diff --name-only --no-renames HEAD^1 HEAD)"; then
            echo "${changed}"
            echo "${changed}" | libexec/maintenance/ci-jobs.sh | tee -a "${GITHUB_OUTPUT}"
          else
            libexec/maintenance/ci-jobs.sh --all | tee -a "${GITHUB_OUTPUT}"
          fi

  # The unit tests, which include every check that reads the docs (the
  # language count, the languages table, the generated skill reference).
  docs:
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: The unit tests
        env:
          HECATRON_NO_GO: "1"
        run: python3 -m unittest discover -s tests

  test:
    needs: changes
    if: needs.changes.outputs.test_os != '[]'
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.changes.outputs.test_os) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck (macOS)
        if: runner.os == 'macOS'
        run: brew install shellcheck
      - name: shellcheck and the unit tests
        run: bin/hecatron self test
      - name: The command runs
        run: bin/hecatron --version && bin/hct help

  # Hecatron tested with itself (.hecatron/config.json): its toolchain from
  # hct install, the binary from hct self build, then hct lint and hct test,
  # as a user's project would run them, with annotations on the change.
  self-hosted:
    needs: changes
    if: needs.changes.outputs.self_hosted == 'true'
    runs-on: ubuntu-latest
    env:
      HECATRON_OUTPUT: ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: hct install (Go's linter)
        run: bin/hct install
      - name: hct self build
        run: bin/hct self build
      - name: hct lint
        run: bin/hct lint
      - name: hct test
        run: bin/hct test

  # The Go core (docs/contributing/design.md §19): formatted, vetted and tested.
  go:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt, go vet and the tests
        run: |
          # tests/format/fixtures/ is misformatted on purpose (hct format's tests).
          unformatted="$(gofmt -l . | grep -v '^tests/format/fixtures/' || true)"
          if [ -n "${unformatted}" ]; then echo "Not gofmt-formatted: ${unformatted}"; exit 1; fi
          go vet ./...
          go test ./...
      - name: Cross-compile for every platform the binary ships for
        run: |
          for os in linux darwin windows; do
            for arch in amd64 arm64; do
              echo "${os}/${arch}"
              GOOS="${os}" GOARCH="${arch}" go build -o /dev/null ./cmd/hecatron
            done
          done

  # Installs as data (docs/contributing/install-engine.md): languages installed in fresh
  # containers both ways, from their scripts and from install.json, must
  # end up the same (tests/docker/parity.sh). Bash and Raku install a tool
  # for some project files, Racket runs guarded steps, Zig is a release
  # download.
  install-parity:
    needs: changes
    if: needs.changes.outputs.install_parity == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Script and data installs agree
        run: tests/docker/parity.sh ubuntu:24.04 bash raku racket zig

  # Hecatron runs on the bash macOS ships (3.2); the runners' bash is newer,
  # so run the tests under 3.2 itself.
  bash-3-2:
    needs: changes
    if: needs.changes.outputs.bash_3_2 == 'true'
    runs-on: ubuntu-latest
    container: bash:3.2
    steps:
      - name: Install Python, git and perl
        run: apk add --no-cache python3 git perl ncurses
      - uses: actions/checkout@v4
      - name: Unit and command tests under bash 3.2
        run: |
          git config --global --add safe.directory "*"
          git config --global user.email ci@example.com
          git config --global user.name CI
          bash --version | head -1
          python3 -m unittest discover -s tests

  # hecatron's own installer (install.sh): on Linux in a throwaway container,
  # where it may edit the user's startup files, and on macOS, where the login
  # shell is zsh and sh is bash 3.2, in a temporary HOME.
  installer-linux:
    needs: changes
    if: needs.changes.outputs.installer_linux == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: install.sh in a container
        run: tests/docker/run.sh ubuntu:24.04 bash /hecatron/tests/installer/check.sh
      - name: install.sh on bare images, which lack git, Python and curl
        run: |
          for image in ubuntu:24.04 debian:13 fedora:42; do
            docker run --rm -v "$PWD:/hecatron:ro" "$image" sh -c '
              printf "[safe]\n\tdirectory = *\n" > /root/.gitconfig
              HECATRON_REPO=/hecatron sh < /hecatron/install.sh && bash -lc "hct --version"'
          done

  installer-macos:
    needs: changes
    if: needs.changes.outputs.installer_macos == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: curl | sh, as a new zsh user
        run: |
          export HOME="$(mktemp -d)" SHELL=/bin/zsh HECATRON_REPO="$PWD"
          git config --global --add safe.directory "*"
          sh < install.sh
          grep -F '.hecatron/env' "$HOME/.zshrc" "$HOME/.profile"
          zsh -ic 'command -v hct' | grep -F "$HOME/.hecatron/bin/hct"
          bash -lc 'command -v hct' | grep -F "$HOME/.hecatron/bin/hct"
          zsh -ic 'hct --version'

  # The one check to require: fails if any job failed or was cancelled, and
  # passes when the rest succeeded or weren't needed (skipped).
  ci-ok:
    if: always()
    needs:
      - changes
      - docs
      - test
      - self-hosted
      - go
      - install-parity
      - bash-3-2
      - installer-linux
      - installer-macos
    runs-on: ubuntu-latest
    steps:
      - name: Every selected job passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Results: ${RESULTS}"
          for result in ${RESULTS}; do
            case "${result}" in
              success | skipped) ;;
              *) echo "::error::A job ended ${result}"; exit 1 ;;
            esac
          done
