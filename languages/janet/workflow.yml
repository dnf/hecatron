name: Janet

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: age/impl/janet
    steps:
      - uses: actions/checkout@v4
      - name: Install Janet
        run: |
          cd /tmp
          curl -sL https://github.com/janet-lang/janet/archive/refs/tags/v1.37.1.tar.gz | tar xz
          cd janet-1.37.1
          make -j$(nproc)
          sudo make install
      - run: janet test_format_age.janet

      # Check the real CLI against the canonical spec and the Python
      # reference, independently of this language's own tests
      # (docs/testing.md).
      - name: Build CLI
        if: runner.os != 'Windows'
        working-directory: .
        run: cli/impl/janet/sayable version
      - name: CLI harness (single REPL process)
        if: runner.os != 'Windows'
        working-directory: .
        run: bash cli/test-harness.sh cli/impl/janet/sayable
      - name: Fuzz against the Python reference
        if: runner.os != 'Windows'
        working-directory: .
        run: python3 cli/fuzz.py --langs janet -n 2000 --invalid-rate 0
