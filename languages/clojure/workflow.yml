name: Clojure

on:
  push:
    branches: [main]
    paths:
      - 'sayable-age/src/clojure/**'
      - 'sayable-age/codegen/**'
      - '.github/workflows/clojure.yml'
  pull_request:
    branches: [main]
    paths:
      - 'sayable-age/src/clojure/**'
      - 'sayable-age/codegen/**'
      - '.github/workflows/clojure.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - uses: DeLaGuardo/setup-clojure@13.1
        with:
          cli: 'latest'

      - name: Cache Clojure deps
        uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
          key: clojure-${{ hashFiles('sayable-age/src/clojure/deps.edn') }}

      - name: Run tests
        working-directory: sayable-age/src/clojure
        run: clojure -M:test
