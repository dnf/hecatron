name: Clojure

on:
  push:
    branches: [main]
    paths:
      - 'age/impl/clojure/**'
      - 'age/codegen/**'
      - '.github/workflows/clojure.yml'
  pull_request:
    branches: [main]
    paths:
      - 'age/impl/clojure/**'
      - 'age/codegen/**'
      - '.github/workflows/clojure.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - uses: DeLaGuardo/setup-clojure@13.1
        with:
          cli: 'latest'

      - name: Cache Clojure deps
        uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
          key: clojure-${{ hashFiles('age/impl/clojure/deps.edn') }}

      - name: Run tests
        working-directory: age/impl/clojure
        run: clojure -M:test

      # Check the real CLI against the canonical spec and the Python
      # reference, independently of this language's own tests
      # (docs/testing.md).
      - name: Build CLI
        if: runner.os != 'Windows'
        working-directory: .
        run: echo version | cli/impl/clojure/sayable --repl
      - name: CLI REPL conformance and harness (single REPL process)
        if: runner.os != 'Windows'
        working-directory: .
        run: python3 cli/check-repl.py cli/impl/clojure/sayable && bash cli/test-harness.sh cli/impl/clojure/sayable
      - name: Fuzz against the Python reference
        if: runner.os != 'Windows'
        working-directory: .
        run: python3 cli/fuzz.py --langs clojure -n 2000
