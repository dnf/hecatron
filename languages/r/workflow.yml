name: R

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        r-version: ["4.3", "4.4"]
    defaults:
      run:
        working-directory: age/impl/r
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.r-version }}
          use-public-rspm: true
      - name: Install testthat
        run: Rscript -e 'install.packages("testthat")'
      - run: Rscript tests/testthat.R
      # testthat is already installed in the job's library by the step above.
      - name: Test date library
        working-directory: date/impl/r
        run: Rscript tests/testthat.R
      - name: Test duration library
        working-directory: duration/impl/r
        run: Rscript tests/testthat.R
      - name: Test time library
        working-directory: time/impl/r
        run: Rscript tests/testthat.R

      # Check the real CLI against the canonical spec and the Python
      # reference, independently of this language's own tests
      # (docs/testing.md).
      - name: Build CLI
        if: runner.os != 'Windows'
        working-directory: .
        run: cli/impl/r/sayable version
      - name: CLI REPL conformance and harness (single REPL process)
        if: runner.os != 'Windows'
        working-directory: .
        run: python3 cli/check-repl.py cli/impl/r/sayable && bash cli/test-harness.sh cli/impl/r/sayable
      - name: Fuzz against the Python reference
        if: runner.os != 'Windows'
        working-directory: .
        run: python3 cli/fuzz.py --langs r -n 2000
