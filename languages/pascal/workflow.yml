name: Pascal

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: age/impl/pascal
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y fpc
      - run: mkdir -p build && fpc -FEbuild -FUbuild -Fulocales -o"build/test_format_age" test_format_age.pas
      - run: ./build/test_format_age
      - name: Test date library
        working-directory: date/impl/pascal
        run: mkdir -p build && fpc -FEbuild -FUbuild -Fulocales -o"build/test_sayabledate" test_sayabledate.pas && ./build/test_sayabledate
      - name: Test duration library
        working-directory: duration/impl/pascal
        run: mkdir -p build && fpc -FEbuild -FUbuild -Fulocales -o"build/test_sayableduration" test_sayableduration.pas && ./build/test_sayableduration
      - name: Test time library
        working-directory: time/impl/pascal
        run: mkdir -p build && fpc -FEbuild -FUbuild -Fulocales -o"build/test_sayabletime" test_sayabletime.pas && ./build/test_sayabletime

      # Check the real CLI against the canonical spec and the Python
      # reference, independently of this language's own tests
      # (docs/testing.md).
      - name: Build CLI
        if: runner.os != 'Windows'
        working-directory: .
        run: cli/impl/pascal/sayable version
      - name: CLI REPL conformance and harness (single REPL process)
        if: runner.os != 'Windows'
        working-directory: .
        run: python3 cli/check-repl.py cli/impl/pascal/sayable && bash cli/test-harness.sh cli/impl/pascal/sayable
      - name: Fuzz against the Python reference
        if: runner.os != 'Windows'
        working-directory: .
        run: python3 cli/fuzz.py --langs pascal -n 2000
