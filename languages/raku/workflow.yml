name: Raku

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: age/impl/raku
    steps:
      - uses: actions/checkout@v4
      - uses: Raku/setup-raku@v1
      - run: zef install --/test App::Prove6
      - run: prove6 -I lib t/
