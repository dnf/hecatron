name: Julia

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        julia-version: ["1.10", "1.11"]
    defaults:
      run:
        working-directory: age/impl/julia
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.julia-version }}
      - run: julia --project -e 'using Pkg; Pkg.test()'

      - name: Test date library
        working-directory: date/impl/julia
        run: julia --project -e 'using Pkg; Pkg.test()'
      - name: Test duration library
        working-directory: duration/impl/julia
        run: julia --project -e 'using Pkg; Pkg.test()'
      - name: Test time library
        working-directory: time/impl/julia
        run: julia --project -e 'using Pkg; Pkg.test()'

      # Check the real CLI against the canonical spec and the Python
      # reference, independently of this language's own tests
      # (docs/testing.md).
      - name: Build CLI
        if: runner.os != 'Windows'
        working-directory: .
        run: cli/impl/julia/sayable version
      - name: CLI REPL conformance and harness (single REPL process)
        if: runner.os != 'Windows'
        working-directory: .
        run: python3 cli/check-repl.py cli/impl/julia/sayable && bash cli/test-harness.sh cli/impl/julia/sayable
      - name: Fuzz against the Python reference
        if: runner.os != 'Windows'
        working-directory: .
        run: python3 cli/fuzz.py --langs julia -n 2000
