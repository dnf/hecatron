name: Prolog

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: age/impl/prolog
    steps:
      - uses: actions/checkout@v4
      - uses: logtalk-actions/setup-swi-prolog@master
      - run: swipl -g "run_tests, halt(0)" -t "halt(1)" tests/test_formatter.pl
