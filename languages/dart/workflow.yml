name: Dart

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        sdk: ["3.2.0", "stable"]
    defaults:
      run:
        working-directory: age/impl/dart
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: ${{ matrix.sdk }}
      - run: dart pub get
      - run: dart test
      - run: dart analyze
      - name: Test date library
        working-directory: date/impl/dart
        run: dart pub get && dart test
      - name: Test duration library
        working-directory: duration/impl/dart
        run: dart pub get && dart test
      - name: Test time library
        working-directory: time/impl/dart
        run: dart pub get && dart test

      # Check the real CLI against the canonical spec and the Python
      # reference, independently of this language's own tests
      # (docs/testing.md).
      - name: Build CLI
        if: runner.os != 'Windows'
        working-directory: .
        run: cli/impl/dart/sayable version
      - name: CLI REPL conformance and harness (single REPL process)
        if: runner.os != 'Windows'
        working-directory: .
        run: python3 cli/check-repl.py cli/impl/dart/sayable && bash cli/test-harness.sh cli/impl/dart/sayable
      - name: Fuzz against the Python reference
        if: runner.os != 'Windows'
        working-directory: .
        run: python3 cli/fuzz.py --langs dart -n 2000
