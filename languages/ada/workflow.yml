name: Ada

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: age/impl/ada
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y gnat gprbuild
      - run: gprbuild -P sayableage.gpr -XBUILD_MODE=test
      - run: ./build/test_format_age

      # Check the real CLI against the canonical spec and the Python
      # reference, independently of this language's own tests
      # (docs/testing.md).
      - name: Build CLI
        if: runner.os != 'Windows'
        working-directory: .
        run: cli/impl/ada/sayable version
      - name: CLI REPL conformance and harness (single REPL process)
        if: runner.os != 'Windows'
        working-directory: .
        run: python3 cli/check-repl.py cli/impl/ada/sayable && bash cli/test-harness.sh cli/impl/ada/sayable
      - name: Fuzz against the Python reference
        if: runner.os != 'Windows'
        working-directory: .
        run: python3 cli/fuzz.py --langs ada -n 2000
