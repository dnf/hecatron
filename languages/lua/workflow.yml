name: Lua

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        lua-version: ["5.3", "5.4"]
    defaults:
      run:
        working-directory: age/impl/lua
    steps:
      - uses: actions/checkout@v4
      - uses: leafo/gh-actions-lua@v10
        with:
          luaVersion: ${{ matrix.lua-version }}
      - uses: leafo/gh-actions-luarocks@v4
      - run: luarocks install busted
      - run: busted test_sayableage.lua

      - name: Test date library
        working-directory: date/impl/lua
        run: busted test_sayabledate.lua
      - name: Test duration library
        working-directory: duration/impl/lua
        run: busted test_sayableduration.lua
      - name: Test time library
        working-directory: time/impl/lua
        run: busted test_sayabletime.lua

      # Check the real CLI against the canonical spec and the Python
      # reference, independently of this language's own tests
      # (docs/testing.md).
      - name: Build CLI
        if: runner.os != 'Windows'
        working-directory: .
        run: cli/impl/lua/sayable version
      - name: CLI REPL conformance and harness (single REPL process)
        if: runner.os != 'Windows'
        working-directory: .
        run: python3 cli/check-repl.py cli/impl/lua/sayable && bash cli/test-harness.sh cli/impl/lua/sayable
      - name: Fuzz against the Python reference
        if: runner.os != 'Windows'
        working-directory: .
        run: python3 cli/fuzz.py --langs lua -n 2000
