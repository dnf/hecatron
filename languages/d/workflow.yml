name: D

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        dc: [dmd-latest, ldc-latest]
    defaults:
      run:
        working-directory: age/impl/d
    steps:
      - uses: actions/checkout@v4
      - uses: dlang-community/setup-dlang@v2
        with:
          compiler: ${{ matrix.dc }}
      - run: dub test

      # Check the real CLI against the canonical spec and the Python
      # reference, independently of this language's own tests
      # (docs/testing.md).
      - name: Build CLI
        if: runner.os != 'Windows' && matrix.dc == 'ldc-latest'
        working-directory: .
        run: bash cli/impl/d/build.sh
      - name: CLI REPL conformance and harness (single REPL process)
        if: runner.os != 'Windows' && matrix.dc == 'ldc-latest'
        working-directory: .
        run: python3 cli/check-repl.py cli/impl/d/sayable && bash cli/test-harness.sh cli/impl/d/sayable
      - name: Fuzz against the Python reference
        if: runner.os != 'Windows' && matrix.dc == 'ldc-latest'
        working-directory: .
        run: python3 cli/fuzz.py --langs d -n 2000
