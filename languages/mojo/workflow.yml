name: Mojo

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: age/impl/mojo
    steps:
      - uses: actions/checkout@v4
      - name: Install Pixi
        run: curl -fsSL https://pixi.sh/install.sh | bash
      - name: Add Pixi to PATH
        run: echo "$HOME/.pixi/bin" >> $GITHUB_PATH
      - name: Install Mojo
        run: |
          pixi init -c https://conda.modular.com/max/ -c conda-forge .
          pixi add mojo
      - name: Run tests
        run: pixi run mojo run -I src tests/test_format_age.mojo
