name: Mojo

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: age/impl/mojo
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.8.8
        with:
          run-install: false
      - name: Install Mojo
        run: |
          pixi init -c https://conda.modular.com/max/ -c conda-forge .
          pixi add "mojo==0.26.1.0"
      - name: Run tests
        run: pixi run mojo run -I src tests/test_format_age.mojo

  # Check the real CLI against the canonical spec and the Python reference,
  # independently of this language's own tests (docs/testing.md). The CLI
  # links all four libraries, and on Linux that build exhausts a 16 GB
  # runner (memory log showed swap filling); on macOS it peaks at ~3.4 GB.
  cli:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.8.8
        with:
          run-install: false
      - name: Install Mojo
        working-directory: age/impl/mojo
        run: |
          pixi init -c https://conda.modular.com/max/ -c conda-forge .
          pixi add "mojo==0.26.1.0"
      - name: Build CLI
        run: bash cli/impl/mojo/build.sh
      - name: CLI REPL conformance and harness (single REPL process)
        run: python3 cli/check-repl.py cli/impl/mojo/sayable && bash cli/test-harness.sh cli/impl/mojo/sayable
      - name: Fuzz against the Python reference
        run: python3 cli/fuzz.py --langs mojo -n 2000
