name: Bash

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        bash-version: ["5"]
    defaults:
      run:
        working-directory: age/impl/bash
    steps:
      - uses: actions/checkout@v4
      - name: Check Bash version
        run: bash --version
      - name: Run tests
        run: bash test_format_age.sh

      # Check the real CLI against the canonical spec and the Python
      # reference, independently of this language's own tests
      # (docs/testing.md).
      - name: Build CLI
        if: runner.os != 'Windows'
        working-directory: .
        run: cli/impl/bash/sayable version
      - name: CLI REPL conformance and harness (single REPL process)
        if: runner.os != 'Windows'
        working-directory: .
        run: python3 cli/check-repl.py cli/impl/bash/sayable && bash cli/test-harness.sh cli/impl/bash/sayable
      - name: Fuzz against the Python reference
        if: runner.os != 'Windows'
        working-directory: .
        run: python3 cli/fuzz.py --langs bash -n 2000
