name: COBOL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/cobol
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y gnucobol cmake
      - run: cmake -B build
      - run: cmake --build build
      - run: cd build && ctest --output-on-failure
