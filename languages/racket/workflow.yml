name: Racket

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        racket-version: ["8.14", "8.15"]
    defaults:
      run:
        working-directory: age/impl/racket
    steps:
      - uses: actions/checkout@v4
      - uses: Bogdanp/setup-racket@v1.14
        with:
          version: ${{ matrix.racket-version }}
      - run: raco test test/
      - name: Test date library
        working-directory: date/impl/racket
        run: raco test test-format-date.rkt
      - name: Test duration library
        working-directory: duration/impl/racket
        run: raco test test-format-duration.rkt
      - name: Test time library
        working-directory: time/impl/racket
        run: raco test test-format-time.rkt

      # Check the real CLI against the canonical spec and the Python
      # reference, independently of this language's own tests
      # (docs/testing.md).
      - name: Build CLI
        if: runner.os != 'Windows'
        working-directory: .
        run: cli/impl/racket/sayable version
      - name: CLI REPL conformance and harness (single REPL process)
        if: runner.os != 'Windows'
        working-directory: .
        run: python3 cli/check-repl.py cli/impl/racket/sayable && bash cli/test-harness.sh cli/impl/racket/sayable
      - name: Fuzz against the Python reference
        if: runner.os != 'Windows'
        working-directory: .
        run: python3 cli/fuzz.py --langs racket -n 2000
