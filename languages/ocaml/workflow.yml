name: OCaml

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        ocaml-compiler: ['4.14.x', '5.1.x', '5.2.x']
    defaults:
      run:
        working-directory: age/impl/ocaml
    steps:
      - uses: actions/checkout@v4
      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: ${{ matrix.ocaml-compiler }}
      - run: opam install . --deps-only --with-test --yes
      - run: opam exec -- dune build
      - run: opam exec -- dune runtest

      # Check the real CLI against the canonical spec and the Python
      # reference, independently of this language's own tests
      # (docs/testing.md).
      - name: Build CLI
        if: runner.os != 'Windows'
        working-directory: .
        run: opam exec -- cli/impl/ocaml/sayable version
      - name: CLI REPL conformance and harness (single REPL process)
        if: runner.os != 'Windows'
        working-directory: .
        run: opam exec -- python3 cli/check-repl.py cli/impl/ocaml/sayable && opam exec -- bash cli/test-harness.sh cli/impl/ocaml/sayable
      - name: Fuzz against the Python reference
        if: runner.os != 'Windows'
        working-directory: .
        run: opam exec -- python3 cli/fuzz.py --langs ocaml -n 2000
