name: Wren

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: age/impl/wren
    steps:
      - uses: actions/checkout@v4
      - name: Install wren_cli
        run: |
          curl -fsSL -o /tmp/wren-cli.zip https://github.com/wren-lang/wren-cli/releases/download/0.4.0/wren-cli-linux-0.4.0.zip
          unzip -o /tmp/wren-cli.zip -d /tmp
          sudo cp /tmp/wren-cli-linux-0.4.0/wren_cli /usr/local/bin/wren_cli
          sudo chmod +x /usr/local/bin/wren_cli
          rm -rf /tmp/wren-cli.zip /tmp/wren-cli-linux-0.4.0
      - run: wren_cli test_format_age.wren
      - name: Test date library
        working-directory: date/impl/wren
        run: wren_cli test_format_date.wren
      - name: Test duration library
        working-directory: duration/impl/wren
        run: wren_cli test_format_duration.wren
      - name: Test time library
        working-directory: time/impl/wren
        run: wren_cli test_format_time.wren

      # Check the real CLI against the canonical spec and the Python
      # reference, independently of this language's own tests
      # (docs/testing.md).
      - name: Build CLI
        if: runner.os != 'Windows'
        working-directory: .
        run: cli/impl/wren/sayable version
      - name: CLI REPL conformance and harness (single REPL process)
        if: runner.os != 'Windows'
        working-directory: .
        run: python3 cli/check-repl.py cli/impl/wren/sayable && bash cli/test-harness.sh cli/impl/wren/sayable
      - name: Fuzz against the Python reference
        if: runner.os != 'Windows'
        working-directory: .
        run: python3 cli/fuzz.py --langs wren -n 2000
