name: Nim

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        nim-version: ["stable", "devel"]
    defaults:
      run:
        working-directory: age/impl/nim
    steps:
      - uses: actions/checkout@v4
      - uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: ${{ matrix.nim-version }}
      - run: nimble test -y
      - name: Test date library
        working-directory: date/impl/nim
        run: nimble test -y
      - name: Test duration library
        working-directory: duration/impl/nim
        run: nimble test -y
      - name: Test time library
        working-directory: time/impl/nim
        run: nimble test -y

      # Check the real CLI against the canonical spec and the Python
      # reference, independently of this language's own tests
      # (docs/testing.md).
      - name: Build CLI
        if: runner.os != 'Windows'
        working-directory: .
        run: cli/impl/nim/sayable version
      - name: CLI REPL conformance and harness (single REPL process)
        if: runner.os != 'Windows'
        working-directory: .
        run: python3 cli/check-repl.py cli/impl/nim/sayable && bash cli/test-harness.sh cli/impl/nim/sayable
      - name: Fuzz against the Python reference
        if: runner.os != 'Windows'
        working-directory: .
        run: python3 cli/fuzz.py --langs nim -n 2000
