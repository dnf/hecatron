name: V

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: age/impl/v
    steps:
      - uses: actions/checkout@v4
      - uses: vlang/setup-v@v1
      - run: v test .
      - name: Test date library
        working-directory: date/impl/v
        run: v test .
      - name: Test duration library
        working-directory: duration/impl/v
        run: v test .
      - name: Test time library
        working-directory: time/impl/v
        run: v test .

      # Check the real CLI against the canonical spec and the Python
      # reference, independently of this language's own tests
      # (docs/testing.md).
      - name: Build CLI
        if: runner.os != 'Windows'
        working-directory: .
        run: cli/impl/v/sayable version
      - name: CLI REPL conformance and harness (single REPL process)
        if: runner.os != 'Windows'
        working-directory: .
        run: python3 cli/check-repl.py cli/impl/v/sayable && bash cli/test-harness.sh cli/impl/v/sayable
      - name: Fuzz against the Python reference
        if: runner.os != 'Windows'
        working-directory: .
        run: python3 cli/fuzz.py --langs v -n 2000
