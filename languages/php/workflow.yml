name: PHP

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php-version: ["8.1", "8.2", "8.3", "8.4"]
    defaults:
      run:
        working-directory: age/impl/php
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          tools: composer
      - run: composer install --no-interaction --prefer-dist
      - run: composer test
      - name: Test date library
        working-directory: date/impl/php
        run: composer install --no-interaction --prefer-dist && composer test
      - name: Test duration library
        working-directory: duration/impl/php
        run: composer install --no-interaction --prefer-dist && composer test
      - name: Test time library
        working-directory: time/impl/php
        run: composer install --no-interaction --prefer-dist && composer test

      # Check the real CLI against the canonical spec and the Python
      # reference, independently of this language's own tests
      # (docs/testing.md).
      - name: Build CLI
        if: runner.os != 'Windows'
        working-directory: .
        run: cli/impl/php/sayable version
      - name: CLI REPL conformance and harness (single REPL process)
        if: runner.os != 'Windows'
        working-directory: .
        run: python3 cli/check-repl.py cli/impl/php/sayable && bash cli/test-harness.sh cli/impl/php/sayable
      - name: Fuzz against the Python reference
        if: runner.os != 'Windows'
        working-directory: .
        run: python3 cli/fuzz.py --langs php -n 2000
