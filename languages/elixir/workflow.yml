name: Elixir

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: age/impl/elixir
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: '27'
          elixir-version: '1.17'
      - run: mix compile --warnings-as-errors
      - run: mix test

      # Check the real CLI against the canonical spec and the Python
      # reference, independently of this language's own tests
      # (docs/testing.md).
      - name: Build CLI
        if: runner.os != 'Windows'
        working-directory: .
        run: (cd cli/impl/elixir && mix deps.get && mix compile)
      - name: CLI harness (single REPL process)
        if: runner.os != 'Windows'
        working-directory: .
        run: bash cli/test-harness.sh cli/impl/elixir/sayable
      - name: Fuzz against the Python reference
        if: runner.os != 'Windows'
        # Known library bug: since --short drops hours for some locales.
        continue-on-error: true
        working-directory: .
        run: python3 cli/fuzz.py --langs elixir -n 2000 --invalid-rate 0
