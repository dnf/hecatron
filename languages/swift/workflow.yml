name: Swift

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: age/impl/swift
    steps:
      - uses: actions/checkout@v4
      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: 6.0
      - run: swift test

      # Check the real CLI against the canonical spec and the Python
      # reference, independently of this language's own tests
      # (docs/testing.md).
      - name: Build CLI
        if: runner.os != 'Windows'
        working-directory: .
        run: cli/impl/swift/sayable version
      - name: CLI harness (single REPL process)
        if: runner.os != 'Windows'
        working-directory: .
        run: bash cli/test-harness.sh cli/impl/swift/sayable
      - name: Fuzz against the Python reference
        if: runner.os != 'Windows'
        working-directory: .
        run: python3 cli/fuzz.py --langs swift -n 2000 --invalid-rate 0
