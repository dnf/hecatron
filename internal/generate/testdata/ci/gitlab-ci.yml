variables:
  HECATRON_VERSION: v0.4.0
  HECATRON_REPORT_DIR: hecatron-reports

default:
  image: 'ubuntu:24.04'
  before_script:
    - 'apt-get update -qq && apt-get install -y -qq --no-install-recommends ca-certificates curl > /dev/null'
    - 'curl -fsSL "https://raw.githubusercontent.com/dnf/hecatron/${HECATRON_VERSION}/install.sh" | HECATRON_NO_MODIFY_PATH=1 sh'
    - '. "${HOME}/.hecatron/env"'

bash:
  timeout: 60m
  script:
    - hct install bash
    - hct test bash
    - hct lint bash
  artifacts:
    when: always
    reports:
      junit: hecatron-reports/test-bash.junit.xml
      codequality: hecatron-reports/lint-bash.codequality.json

elixir:
  timeout: 60m
  script:
    - hct install elixir
    - hct test elixir
    - hct lint elixir
  artifacts:
    when: always
    reports:
      junit: hecatron-reports/test-elixir.junit.xml
      codequality: hecatron-reports/lint-elixir.codequality.json

