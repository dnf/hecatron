variables:
  HECATRON_VERSION: v0.4.0

default:
  image: 'ubuntu:24.04'
  before_script:
    - 'apt-get update -qq && apt-get install -y -qq --no-install-recommends ca-certificates curl > /dev/null'
    - 'curl -fsSL "https://raw.githubusercontent.com/dnf/hecatron/${HECATRON_VERSION}/install.sh" | HECATRON_NO_MODIFY_PATH=1 sh'
    - '. "${HOME}/.hecatron/env"'

bash:
  timeout: 60m
  script:
    - hct install bash
    - hct test bash
    - hct lint bash

elixir:
  timeout: 60m
  script:
    - hct install elixir
    - hct test elixir
    - hct lint elixir

go:
  timeout: 60m
  script:
    - hct install go
    - hct test go
    - hct lint go

python:
  timeout: 60m
  script:
    - hct install python
    - hct test python
    - hct lint python

rust:
  timeout: 60m
  script:
    - hct install rust
    - hct test rust
    - hct lint rust
