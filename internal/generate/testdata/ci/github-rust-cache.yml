name: Rust
on: push
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Cache rust toolchain
        uses: actions/cache@v4
        with:
          path: |
            ~/.rustup
            ~/.cargo/bin
          key: 'hecatron-rust-toolchain-${{ runner.os }}-v0.4.0-${{ hashFiles(''.hecatron/config.json'', ''.hecatron/languages/rust/config.json'', ''**/rust-toolchain.toml'', ''**/rust-toolchain'', ''**/.tool-versions'', ''**/mise.toml'', ''**/.mise.toml'') }}'
          restore-keys: 'hecatron-rust-toolchain-${{ runner.os }}-v0.4.0-'
      - name: Cache rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: 'hecatron-rust-dependencies-${{ runner.os }}-${{ hashFiles(''**/Cargo.lock'') }}'
          restore-keys: 'hecatron-rust-dependencies-${{ runner.os }}-'

      - run: hct test rust
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Cache rust toolchain
        uses: actions/cache@v4
        with:
          path: |
            ~/.rustup
            ~/.cargo/bin
          key: 'hecatron-rust-toolchain-${{ runner.os }}-v0.4.0-${{ hashFiles(''.hecatron/config.json'', ''.hecatron/languages/rust/config.json'', ''**/rust-toolchain.toml'', ''**/rust-toolchain'', ''**/.tool-versions'', ''**/mise.toml'', ''**/.mise.toml'') }}'
          restore-keys: 'hecatron-rust-toolchain-${{ runner.os }}-v0.4.0-'
      - name: Cache rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: 'hecatron-rust-dependencies-${{ runner.os }}-${{ hashFiles(''**/Cargo.lock'') }}'
          restore-keys: 'hecatron-rust-dependencies-${{ runner.os }}-'
      - run: hct lint rust
