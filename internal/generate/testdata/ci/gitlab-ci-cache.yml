variables:
  HECATRON_VERSION: v0.4.0

default:
  image: 'debian:13'
  before_script:
    - 'apt-get update -qq && apt-get install -y -qq --no-install-recommends ca-certificates curl > /dev/null'
    - 'curl -fsSL "https://raw.githubusercontent.com/dnf/hecatron/${HECATRON_VERSION}/install.sh" | HECATRON_NO_MODIFY_PATH=1 sh'
    - '. "${HOME}/.hecatron/env"'

bash:
  timeout: 60m
  script:
    - hct install bash
    - hct test bash
    - hct lint bash

elixir:
  timeout: 60m
  cache:
    - key:
        files:
          - .hecatron/config.json
          - .hecatron/languages/elixir/config.json
        prefix: elixir-toolchain-v0.4.0
      paths:
        - .hecatron-cache/elixir/mix
    - key:
        files:
          - '**/mix.lock'
        prefix: elixir-dependencies
      paths:
        - .hecatron-cache/elixir/hex
        - age/elixir/deps
        - date/elixir/deps
  script:
    - 'mkdir -p ".hecatron-cache/elixir/mix" "$(dirname "${HOME}/.mix")" && ln -sfn "${CI_PROJECT_DIR}/.hecatron-cache/elixir/mix" "${HOME}/.mix"'
    - 'mkdir -p ".hecatron-cache/elixir/hex" "$(dirname "${HOME}/.hex")" && ln -sfn "${CI_PROJECT_DIR}/.hecatron-cache/elixir/hex" "${HOME}/.hex"'
    - hct install elixir
    - hct test elixir
    - hct lint elixir

go:
  timeout: 60m
  cache:
    - key:
        files:
          - '**/go.sum'
        prefix: go-dependencies
      paths:
        - .hecatron-cache/go/go-pkg-mod
        - .hecatron-cache/go/cache-go-build
  script:
    - 'mkdir -p ".hecatron-cache/go/go-pkg-mod" "$(dirname "${HOME}/go/pkg/mod")" && ln -sfn "${CI_PROJECT_DIR}/.hecatron-cache/go/go-pkg-mod" "${HOME}/go/pkg/mod"'
    - 'mkdir -p ".hecatron-cache/go/cache-go-build" "$(dirname "${HOME}/.cache/go-build")" && ln -sfn "${CI_PROJECT_DIR}/.hecatron-cache/go/cache-go-build" "${HOME}/.cache/go-build"'
    - hct install go
    - hct test go
    - hct lint go

python:
  timeout: 60m
  cache:
    - key:
        files:
          - .hecatron/config.json
          - .hecatron/languages/python/config.json
          - '**/.python-version'
          - '**/.tool-versions'
          - '**/mise.toml'
          - '**/.mise.toml'
          - '**/pyproject.toml'
          - '**/setup.cfg'
          - '**/setup.py'
        prefix: python-toolchain-v0.4.0
      paths:
        - .hecatron-cache/python/local-share-uv-python
    - key:
        files:
          - '**/uv.lock'
          - '**/requirements*.txt'
          - '**/pyproject.toml'
        prefix: python-dependencies
      paths:
        - .hecatron-cache/python/cache-uv
  script:
    - 'mkdir -p ".hecatron-cache/python/local-share-uv-python" "$(dirname "${HOME}/.local/share/uv/python")" && ln -sfn "${CI_PROJECT_DIR}/.hecatron-cache/python/local-share-uv-python" "${HOME}/.local/share/uv/python"'
    - 'mkdir -p ".hecatron-cache/python/cache-uv" "$(dirname "${HOME}/.cache/uv")" && ln -sfn "${CI_PROJECT_DIR}/.hecatron-cache/python/cache-uv" "${HOME}/.cache/uv"'
    - hct install python
    - hct test python
    - hct lint python

rust:
  timeout: 60m
  cache:
    - key:
        files:
          - .hecatron/config.json
          - .hecatron/languages/rust/config.json
          - '**/rust-toolchain.toml'
          - '**/rust-toolchain'
          - '**/.tool-versions'
          - '**/mise.toml'
          - '**/.mise.toml'
        prefix: rust-toolchain-v0.4.0
      paths:
        - .hecatron-cache/rust/rustup
        - .hecatron-cache/rust/cargo-bin
    - key:
        files:
          - '**/Cargo.lock'
        prefix: rust-dependencies
      paths:
        - .hecatron-cache/rust/cargo-registry
        - .hecatron-cache/rust/cargo-git
  script:
    - 'mkdir -p ".hecatron-cache/rust/rustup" "$(dirname "${HOME}/.rustup")" && ln -sfn "${CI_PROJECT_DIR}/.hecatron-cache/rust/rustup" "${HOME}/.rustup"'
    - 'mkdir -p ".hecatron-cache/rust/cargo-bin" "$(dirname "${HOME}/.cargo/bin")" && ln -sfn "${CI_PROJECT_DIR}/.hecatron-cache/rust/cargo-bin" "${HOME}/.cargo/bin"'
    - 'mkdir -p ".hecatron-cache/rust/cargo-registry" "$(dirname "${HOME}/.cargo/registry")" && ln -sfn "${CI_PROJECT_DIR}/.hecatron-cache/rust/cargo-registry" "${HOME}/.cargo/registry"'
    - 'mkdir -p ".hecatron-cache/rust/cargo-git" "$(dirname "${HOME}/.cargo/git")" && ln -sfn "${CI_PROJECT_DIR}/.hecatron-cache/rust/cargo-git" "${HOME}/.cargo/git"'
    - hct install rust
    - hct test rust
    - hct lint rust
