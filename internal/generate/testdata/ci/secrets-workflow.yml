name: Secrets

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  security-events: write

jobs:
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install hecatron and gitleaks
        run: |
          curl -fsSL https://raw.githubusercontent.com/dnf/hecatron/v0.4.0/install.sh | HECATRON_VERSION=v0.4.0 sh
          ~/.hecatron/bin/hct install secrets
      - name: Scan for secrets
        run: ~/.hecatron/bin/hct audit secrets
        env:
          HECATRON_REPORT_DIR: hecatron-reports
      - name: Upload the findings to code scanning
        if: always() && hashFiles('hecatron-reports/audit-secrets.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: hecatron-reports/audit-secrets.sarif
