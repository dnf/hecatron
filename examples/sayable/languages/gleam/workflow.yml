name: Gleam

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        gleam-version: ['1.14']
        otp-version: ['26', '27']
    defaults:
      run:
        working-directory: age/impl/gleam
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ matrix.otp-version }}
          gleam-version: ${{ matrix.gleam-version }}
      - run: gleam build
      - run: gleam test

      - name: Test date library
        working-directory: date/impl/gleam
        run: gleam test
      - name: Test duration library
        working-directory: duration/impl/gleam
        run: gleam test
      - name: Test time library
        working-directory: time/impl/gleam
        run: gleam test

      # Check the real CLI against the canonical spec and the Python
      # reference, independently of this language's own tests
      # (docs/testing.md).
      - name: Build CLI
        if: runner.os != 'Windows'
        working-directory: .
        run: (cd cli/impl/gleam && gleam build)
      - name: CLI REPL conformance and harness (single REPL process)
        if: runner.os != 'Windows'
        working-directory: .
        run: python3 cli/check-repl.py cli/impl/gleam/sayable && bash cli/test-harness.sh cli/impl/gleam/sayable
      - name: Fuzz against the Python reference
        if: runner.os != 'Windows'
        working-directory: .
        run: python3 cli/fuzz.py --langs gleam -n 2000
