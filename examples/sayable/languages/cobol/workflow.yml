name: COBOL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: age/impl/cobol
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y gnucobol cmake
      - run: cmake -B build
      - run: cmake --build build
      - run: cd build && ctest --output-on-failure
      - name: Test date library
        working-directory: date/impl/cobol
        run: cmake -B build && cmake --build build && cd build && ctest --output-on-failure
      - name: Test duration library
        working-directory: duration/impl/cobol
        run: cmake -B build && cmake --build build && cd build && ctest --output-on-failure
      - name: Test time library
        working-directory: time/impl/cobol
        run: cmake -B build && cmake --build build && cd build && ctest --output-on-failure

      # Check the real CLI against the canonical spec and the Python
      # reference, independently of this language's own tests
      # (docs/testing.md).
      - name: Build CLI
        if: runner.os != 'Windows'
        working-directory: .
        run: cli/impl/cobol/sayable version
      - name: CLI REPL conformance and harness (single REPL process)
        if: runner.os != 'Windows'
        working-directory: .
        run: python3 cli/check-repl.py cli/impl/cobol/sayable && bash cli/test-harness.sh cli/impl/cobol/sayable
      - name: Fuzz against the Python reference
        if: runner.os != 'Windows'
        working-directory: .
        run: python3 cli/fuzz.py --langs cobol -n 2000
