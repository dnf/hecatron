name: F#

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: age/impl/fsharp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0
      - run: dotnet test

      - name: Test date library
        working-directory: date/impl/fsharp
        run: dotnet test
      - name: Test duration library
        working-directory: duration/impl/fsharp
        run: dotnet test
      - name: Test time library
        working-directory: time/impl/fsharp
        run: dotnet test

      # Check the real CLI against the canonical spec and the Python
      # reference, independently of this language's own tests
      # (docs/testing.md).
      - name: Build CLI
        if: runner.os != 'Windows'
        working-directory: .
        run: dotnet build cli/impl/fsharp/SayableCli.fsproj -c Release --nologo
      - name: CLI REPL conformance and harness (single REPL process)
        if: runner.os != 'Windows'
        working-directory: .
        run: python3 cli/check-repl.py cli/impl/fsharp/sayable && bash cli/test-harness.sh cli/impl/fsharp/sayable
      - name: Fuzz against the Python reference
        if: runner.os != 'Windows'
        working-directory: .
        run: python3 cli/fuzz.py --langs fsharp -n 2000
