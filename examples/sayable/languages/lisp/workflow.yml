name: Common Lisp

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: age/impl/lisp
    steps:
      - uses: actions/checkout@v4
      - name: Install SBCL
        run: sudo apt-get update && sudo apt-get install -y sbcl
      - name: Run tests
        run: |
          sbcl --noinform --non-interactive \
            --eval '(require :asdf)' \
            --eval '(push (truename ".") asdf:*central-registry*)' \
            --eval '(asdf:load-system "sayable-age")' \
            --load test/test-formatter.lisp \
            --eval '(sayable-age-test:run-tests)'

      # The component libraries have no .asd; load their files in order.
      - name: Test date library
        working-directory: date/impl/lisp
        run: sbcl --noinform --non-interactive --load package.lisp --load types.lisp --load formatter.lisp --load load-locales.lisp --load test/test-formatter.lisp --eval '(sayable-date-test:run-tests)'
      - name: Test duration library
        working-directory: duration/impl/lisp
        run: sbcl --noinform --non-interactive --load package.lisp --load types.lisp --load formatter.lisp --load load-locales.lisp --load test/test-formatter.lisp --eval '(sayable-duration-test:run-tests)'
      - name: Test time library
        working-directory: time/impl/lisp
        run: sbcl --noinform --non-interactive --load package.lisp --load types.lisp --load formatter.lisp --load load-locales.lisp --load test/test-formatter.lisp --eval '(sayable-time-test:run-tests)'

      # Check the real CLI against the canonical spec and the Python
      # reference, independently of this language's own tests
      # (docs/testing.md).
      - name: Build CLI
        if: runner.os != 'Windows'
        working-directory: .
        run: cli/impl/lisp/sayable version
      - name: CLI REPL conformance and harness (single REPL process)
        if: runner.os != 'Windows'
        working-directory: .
        run: python3 cli/check-repl.py cli/impl/lisp/sayable && bash cli/test-harness.sh cli/impl/lisp/sayable
      - name: Fuzz against the Python reference
        if: runner.os != 'Windows'
        working-directory: .
        run: python3 cli/fuzz.py --langs lisp -n 2000
