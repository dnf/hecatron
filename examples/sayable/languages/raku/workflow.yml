name: Raku

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: age/impl/raku
    steps:
      - uses: actions/checkout@v4
      - uses: Raku/setup-raku@v1
      - run: zef install --/test App::Prove6
      - run: prove6 -I lib t/
      - name: Test date library
        working-directory: date/impl/raku
        run: prove6 -I lib t/
      - name: Test duration library
        working-directory: duration/impl/raku
        run: prove6 -I lib t/
      - name: Test time library
        working-directory: time/impl/raku
        run: prove6 -I lib t/

      # Check the real CLI against the canonical spec and the Python
      # reference, independently of this language's own tests
      # (docs/testing.md).
      - name: Build CLI
        if: runner.os != 'Windows'
        working-directory: .
        run: cli/impl/raku/sayable version
      - name: CLI REPL conformance and harness (single REPL process)
        if: runner.os != 'Windows'
        working-directory: .
        run: python3 cli/check-repl.py cli/impl/raku/sayable && bash cli/test-harness.sh cli/impl/raku/sayable
      - name: Fuzz against the Python reference
        if: runner.os != 'Windows'
        working-directory: .
        run: python3 cli/fuzz.py --langs raku -n 2000
